name: Architecture Gate

on:
  pull_request:
  push:
    branches:
      - chemzi/dev
      - integration/*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-gate:
    name: architecture-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run architecture gate
        run: python scripts/architecture_gate.py --baseline architecture_baseline.json
